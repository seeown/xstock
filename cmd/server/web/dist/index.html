<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xstock · 战法研究的交易魔方</title>
    <script type="module" crossorigin src="/assets/index-BnKCjIUU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B87pl8vs.css">
  </head>
  <body>
    <div id="root">
      <div id="boot" style="padding:40px;font-family:system-ui,sans-serif;color:#8ea2bd;background:#070d18;min-height:100vh">
        正在加载 xstock…<br /><br />
        <span style="font-size:13px;opacity:.7">若长时间停留在此页，说明浏览器未能执行应用脚本（JS 加载失败或被拦截）。</span>
        <div id="boot-diag" style="margin-top:16px;font-size:13px"></div>
      </div>
    </div>
    <script>
      // 把失败原因留在页面上，而不是留下白屏。
      function bootFail(html) {
        var d = document.getElementById('boot-diag');
        if (d) d.innerHTML = '<b style="color:#f4577a">诊断：</b>' + html;
      }
      // capture 阶段才能收到脚本等子资源的加载失败。
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.src || t.href) && t !== window) {
          bootFail('资源加载失败：<code>' + (t.src || t.href) + '</code>');
          return;
        }
        bootFail('脚本执行出错：<code>' + (e.message || '未知错误') + '</code>');
      }, true);
      window.addEventListener('unhandledrejection', function () { /* 不在此报告 */ });
      // 2 秒后应用仍未启动，则自检主脚本能否取到。
      setTimeout(function () {
        if (window.__boot_done) return;
        var s = document.querySelector('script[type="module"]');
        if (!s) { bootFail('找不到主脚本标签'); return; }
        fetch(s.src).then(function (r) {
          if (!r.ok) { bootFail('主脚本 HTTP ' + r.status + '：<code>' + s.src + '</code>'); return; }
          return r.text().then(function (text) {
            bootFail('主脚本可访问（' + text.length + ' 字节），但应用未启动——脚本可能被浏览器拒绝执行或环境过旧。');
          });
        }).catch(function (err) {
          bootFail('主脚本无法访问：<code>' + String(err) + '</code>');
        });
      }, 2000);
    </script>
  </body>
</html>
