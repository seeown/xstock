<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NStock · N字战法回测</title>
  <style>
    :root { --bg:#f4f6f8; --ink:#14202b; --muted:#65717c; --line:#dfe5e9; --panel:#fff; --blue:#1967d2; --blue-pale:#ebf3ff; --green:#13795b; --red:#c54242; --amber:#aa6b00; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    header { background:#102b46; color:white; padding:20px max(24px,calc((100% - 1200px)/2)); display:flex; align-items:center; justify-content:space-between; gap:20px; }
    h1 { font-size:22px; margin:0; letter-spacing:.2px; } h1 span { font-weight:400; color:#b8cbe0; font-size:14px; margin-left:10px; }
    .tag { color:#b8cbe0; font-size:13px; }
    main { max-width:1200px; margin:0 auto; padding:24px; }
    .layout { display:grid; grid-template-columns:280px 1fr; gap:20px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; }
    h2 { font-size:16px; margin:0 0 16px; } h3 { font-size:14px; margin:22px 0 10px; }
    .field { display:grid; grid-template-columns:1fr 86px; gap:10px; align-items:center; margin:10px 0; } .field label { color:var(--muted); font-size:13px; }
    input { width:100%; border:1px solid #cdd6dd; border-radius:7px; padding:7px 8px; font:inherit; text-align:right; color:var(--ink); } input:focus { outline:2px solid #b9d5fa; border-color:var(--blue); }
    button { border:0; border-radius:7px; background:var(--blue); color:white; padding:10px 13px; font:inherit; cursor:pointer; } button:hover { background:#1457b3; } button:disabled { opacity:.6; cursor:wait; }
    .run { width:100%; margin-top:18px; font-weight:600; } .hint { margin:13px 0 0; color:var(--muted); font-size:12px; }
    .symbol { display:flex; gap:8px; align-items:center; margin-bottom:18px; } .symbol input { text-align:left; max-width:150px; font-weight:600; }
    .symbol button { background:#edf2f6; color:#304250; padding:8px 10px; } .symbol button:hover { background:#dce8f1; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; } .metric { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:15px; }
    .metric small { display:block; color:var(--muted); margin-bottom:5px; } .metric strong { font-size:21px; letter-spacing:-.4px; } .pos { color:var(--green); } .neg { color:var(--red); }
    .chart { height:250px; position:relative; } .chart svg { width:100%; height:100%; overflow:visible; } .axis { stroke:#cfd8df; stroke-width:1; } .close-line { fill:none; stroke:var(--blue); stroke-width:2.4; } .signal { fill:var(--amber); stroke:white; stroke-width:2; } .trade { fill:var(--green); stroke:white; stroke-width:2; }
    .legend { display:flex; flex-wrap:wrap; gap:15px; margin-top:10px; color:var(--muted); font-size:12px; } .dot { width:9px; height:9px; display:inline-block; border-radius:50%; margin-right:5px; } .legend span { display:flex; align-items:center; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; } .section-head p { color:var(--muted); margin:0; font-size:13px; }
    table { width:100%; border-collapse:collapse; } th { color:var(--muted); font-size:12px; font-weight:500; text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); } td { padding:11px 8px; border-bottom:1px solid #edf0f2; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; } .empty { color:var(--muted); text-align:center; padding:28px; }
    #message { min-height:20px; margin:0 0 15px; color:var(--muted); } #message.error { color:var(--red); }
    @media (max-width:800px) { header { padding:17px 18px; } header .tag { display:none; } main { padding:16px; } .layout { grid-template-columns:1fr; } .metrics { grid-template-columns:repeat(2,1fr); } .panel { padding:16px; } .params { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:16px; } .params h2,.params h3,.run,.hint { grid-column:1/-1; } }
    @media (max-width:480px) { h1 span { display:none; } .metrics { gap:8px; } .metric { padding:12px; } .metric strong { font-size:18px; } table { font-size:12px; } th,td { padding:8px 5px; } .chart { height:210px; } }
  </style>
</head>
<body>
  <header><h1>NStock <span>N字战法筛选与回测</span></h1><div class="tag">日线研究工具 · 通达信真实数据</div></header>
  <main>
    <div class="layout">
      <aside class="panel params">
        <h2>策略参数</h2>
        <div class="field"><label for="riseDays">上涨周期（天）</label><input id="riseDays" type="number" min="2"></div>
        <div class="field"><label for="riseMinPct">最小上涨幅度（%）</label><input id="riseMinPct" type="number" min="0.1" step="0.1"></div>
        <h3>回调条件</h3>
        <div class="field"><label for="pullbackMinDays">最短回调（天）</label><input id="pullbackMinDays" type="number" min="1"></div>
        <div class="field"><label for="pullbackMaxDays">最长回调（天）</label><input id="pullbackMaxDays" type="number" min="1"></div>
        <div class="field"><label for="pullbackMaxPct">最大回撤（%）</label><input id="pullbackMaxPct" type="number" min="0.1" step="0.1"></div>
        <div class="field"><label for="volumeRatioMin">突破量比</label><input id="volumeRatioMin" type="number" min="0.1" step="0.1"></div>
        <h3>交易规则</h3>
        <div class="field"><label for="stopLossPct">止损（%）</label><input id="stopLossPct" type="number" min="0.1" step="0.1"></div>
        <div class="field"><label for="takeProfitPct">止盈（%）</label><input id="takeProfitPct" type="number" min="0.1" step="0.1"></div>
        <div class="field"><label for="maxHoldDays">最长持仓（天）</label><input id="maxHoldDays" type="number" min="1"></div>
        <button class="run" id="run">运行回测</button><p class="hint">信号在收盘后生成，按下一交易日开盘价模拟成交。</p>
      </aside>
      <section>
        <div class="symbol"><label for="symbol">股票代码</label><input id="symbol" value="DEMO" placeholder="600519.SH" autocomplete="off"><button id="sync">同步真实数据</button><button id="loadSignals">查看信号</button></div>
        <p id="message" aria-live="polite">已加载 DEMO 演示标的。你可以修改策略参数后运行回测。</p>
        <div class="metrics">
          <div class="metric"><small>总收益</small><strong id="totalReturn">—</strong></div>
          <div class="metric"><small>期末资金</small><strong id="finalCash">—</strong></div>
          <div class="metric"><small>最大回撤</small><strong id="drawdown">—</strong></div>
          <div class="metric"><small>胜率 / 交易次数</small><strong id="winRate">—</strong></div>
        </div>
        <section class="panel"><div class="section-head"><h2>收盘价与策略信号</h2><p id="chartRange"></p></div><div class="chart" id="chart" aria-label="收盘价与策略信号图"></div><div class="legend"><span><i class="dot" style="background:#1967d2"></i>收盘价</span><span><i class="dot" style="background:#aa6b00"></i>N字信号</span><span><i class="dot" style="background:#13795b"></i>模拟买入</span></div></section>
        <section class="panel" style="margin-top:20px"><div class="section-head"><h2>N字候选信号</h2><p id="signalCount">—</p></div><div class="table-wrap"><table><thead><tr><th>信号日期</th><th class="num">突破价</th><th class="num">上涨幅度</th><th class="num">回撤</th><th class="num">量比</th><th>说明</th></tr></thead><tbody id="signals"></tbody></table></div></section>
        <section class="panel" style="margin-top:20px"><div class="section-head"><h2>模拟交易</h2><p id="tradeCount">—</p></div><div class="table-wrap"><table><thead><tr><th>买入日期</th><th>卖出日期</th><th class="num">买入价</th><th class="num">卖出价</th><th class="num">收益</th><th>退出原因</th></tr></thead><tbody id="trades"></tbody></table></div></section>
      </section>
    </div>
  </main>
  <script>
    const ids=['riseDays','riseMinPct','pullbackMinDays','pullbackMaxDays','pullbackMaxPct','volumeRatioMin','stopLossPct','takeProfitPct','maxHoldDays'];
    const $=id=>document.getElementById(id), fmt=n=>Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2}), pct=n=>`${Number(n).toFixed(2)}%`;
    let latestSignals=[], latestTrades=[], latestBars=[];
    function params(){ const p={breakoutBufferPct:0}; ids.forEach(id=>p[id]=Number($(id).value)); return p; }
    function fillParams(p){ ids.forEach(id=>$(id).value=p[id]); }
    function message(text,error=false){ const el=$('message'); el.textContent=text; el.className=error?'error':''; }
    function rows(target, list, columns, empty){ $(target).innerHTML=list.length?list.map(item=>`<tr>${columns.map(col=>`<td class="${col.num?'num':''} ${col.className?col.className(item):''}">${col.value(item)}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${columns.length}">${empty}</td></tr>`; }
    function renderSignals(signals){ latestSignals=signals; $('signalCount').textContent=`${signals.length} 个信号`; rows('signals',signals,[{value:s=>s.Date},{num:true,value:s=>fmt(s.BreakoutPrice)},{num:true,value:s=>pct(s.RisePct)},{num:true,value:s=>pct(s.PullbackPct)},{num:true,value:s=>fmt(s.VolumeRatio)+'×'},{value:s=>s.Reason}], '当前参数下未发现 N 字信号'); renderChart(); }
    function renderTrades(trades){ latestTrades=trades; $('tradeCount').textContent=`${trades.length} 笔交易`; rows('trades',trades,[{value:t=>t.BuyDate},{value:t=>t.SellDate},{num:true,value:t=>fmt(t.BuyPrice)},{num:true,value:t=>fmt(t.SellPrice)},{num:true,className:t=>t.ReturnPct>=0?'pos':'neg',value:t=>pct(t.ReturnPct)},{value:t=>({stop_loss:'止损',take_profit:'止盈',max_hold:'到期平仓'})[t.ExitReason]||t.ExitReason}], '尚未产生模拟交易'); renderChart(); }
    function metric(id,value,kind=''){ const el=$(id); el.textContent=value; el.className=kind; }
    function renderMetrics(m){ metric('totalReturn',pct(m.TotalReturnPct),m.TotalReturnPct>=0?'pos':'neg'); metric('finalCash',fmt(m.FinalCash)); metric('drawdown',pct(m.MaxDrawdownPct),'neg'); metric('winRate',`${pct(m.WinRatePct)} / ${m.TradeCount}`); }
    async function barsFor(symbol){ const res=await fetch(`/api/stocks/${encodeURIComponent(symbol)}/bars`); const data=await res.json(); if(!res.ok) throw Error(data.error||'行情加载失败'); latestBars=data; }
    async function run(){ const symbol=$('symbol').value.trim().toUpperCase(); if(!symbol){message('请输入股票代码。',true);return;} const btn=$('run'); btn.disabled=true; message('正在运行回测…'); try { const [res]=await Promise.all([fetch(`/api/backtests/${encodeURIComponent(symbol)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initialCash:100000,params:params()})}),barsFor(symbol)]); const data=await res.json(); if(!res.ok) throw Error(data.error||'回测失败'); renderMetrics(data.metrics); renderSignals(data.signals); renderTrades(data.trades); message(`回测完成：${symbol} 共发现 ${data.signals.length} 个 N 字信号。`); } catch(e) { message(e.message+' 请先通过行情导入 API 添加该股票日线。',true); } finally { btn.disabled=false; } }
    async function loadSignals(){ const symbol=$('symbol').value.trim().toUpperCase(); try { const [res]=await Promise.all([fetch(`/api/stocks/${encodeURIComponent(symbol)}/signals`),barsFor(symbol)]); const data=await res.json(); if(!res.ok) throw Error(data.error||'加载失败'); renderSignals(data); message(`${symbol} 已加载 ${data.length} 个默认参数信号。`); } catch(e) { message(e.message+' 请使用 DEMO 或导入行情。',true); } }
    async function sync(){ const symbol=$('symbol').value.trim().toUpperCase(); if(!symbol){message('请输入股票代码。',true);return;} if(symbol==='DEMO'){message('DEMO 是内置演示数据；请输入真实代码，例如 600519.SH。',true);return;} const btn=$('sync'); btn.disabled=true; message(`正在从通达信拉取 ${symbol} 前复权日线（全量，可能需要几秒）…`); try { const res=await fetch(`/api/sync/${encodeURIComponent(symbol)}`,{method:'POST'}); const data=await res.json(); if(!res.ok) throw Error(data.error||'同步失败'); message(`同步完成：${symbol} 共 ${data.count} 根日线（${data.firstDate} 至 ${data.lastDate}），正在运行回测…`); await run(); } catch(e) { message(e.message,true); } finally { btn.disabled=false; } }
    function renderChart(){ const host=$('chart'), bars=latestBars; if(!bars.length){host.innerHTML='';return;} const width=Math.max(host.clientWidth,280), height=250, pad={l:42,r:16,t:16,b:28}; const base=bars.map(b=>b.Close), count=base.length; const min=Math.min(...base)*.97,max=Math.max(...base)*1.03; const x=i=>pad.l+i*(width-pad.l-pad.r)/Math.max(count-1,1), y=v=>pad.t+(max-v)*(height-pad.t-pad.b)/(max-min); const path=base.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '); const indexForDate=d=>bars.findIndex(b=>b.Date===d); const markers=latestSignals.map(s=>{const i=indexForDate(s.Date);return i<0?'':`<circle class="signal" cx="${x(i)}" cy="${y(base[i])}" r="5"><title>${s.Date} N字信号</title></circle>`}).join('')+latestTrades.map(t=>{const i=indexForDate(t.BuyDate);return i<0?'':`<path class="trade" d="M${x(i)},${y(base[i])-8} l5,8 h-10 z"><title>${t.BuyDate} 模拟买入</title></path>`}).join(''); host.innerHTML=`<svg viewBox="0 0 ${width} ${height}" role="img"><title>收盘价及策略信号</title><line class="axis" x1="${pad.l}" x2="${width-pad.r}" y1="${height-pad.b}" y2="${height-pad.b}"/><line class="axis" x1="${pad.l}" x2="${pad.l}" y1="${pad.t}" y2="${height-pad.b}"/><text x="4" y="${pad.t+4}" fill="#65717c" font-size="11">${max.toFixed(1)}</text><text x="4" y="${height-pad.b}" fill="#65717c" font-size="11">${min.toFixed(1)}</text><text x="${pad.l}" y="${height-8}" fill="#65717c" font-size="11">${bars[0].Date.slice(5)}</text><text x="${width-pad.r-34}" y="${height-8}" fill="#65717c" font-size="11">${bars.at(-1).Date.slice(5)}</text><path class="close-line" d="${path}"/>${markers}</svg>`; $('chartRange').textContent=`${bars[0].Date} 至 ${bars.at(-1).Date}`; }
    async function init(){ try { const p=await (await fetch('/api/params/default')).json(); fillParams(p); await run(); } catch(e) { message('无法连接后端服务。',true); } }
    $('run').addEventListener('click',run); $('sync').addEventListener('click',sync); $('loadSignals').addEventListener('click',loadSignals); window.addEventListener('resize',renderChart); init();
  </script>
</body>
</html>
